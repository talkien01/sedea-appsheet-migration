name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_SEDEA_Appsheet_Migration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 07_SEDEA_Appsheet_Migration/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck backend
        run: npm run typecheck -w backend

      - name: Build backend
        run: npm run build -w backend

  pwa:
    name: PWA typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 07_SEDEA_Appsheet_Migration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 07_SEDEA_Appsheet_Migration/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck PWA
        run: npm run typecheck -w pwa

      - name: Build PWA
        run: npm run build -w pwa
