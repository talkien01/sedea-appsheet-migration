<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Captura de evidencia de entrega de apoyos agropecuarios - SEDEA Queretaro" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fuentes/Inter-Variable.woff2" onerror="this.remove()" />
    <title>SEDEA Campo</title>
    <!-- Anti-parpadeo: fija data-mode ANTES de que pinte nada, para que una
         recarga en modo claro no muestre un fogonazo oscuro (y viceversa).
         Debe quedarse aqui, sincrono y antes del modulo de la app. -->
    <script>
      (function () {
        try {
          var g = localStorage.getItem('sedea.tema');
          var m = (g === 'dark' || g === 'light') ? g
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-mode', m);
          var meta = document.querySelector('meta[name=theme-color]');
          if (meta) meta.setAttribute('content', m === 'dark' ? '#0A0A0C' : '#F5F4EE');
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
