<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}SEDEA{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
{% block cabeza %}{% endblock %}
</head>
<body>
<nav class="barra">
  <span class="marca">SEDEA — Apoyos históricos</span>
  <a href="/">Fichas</a>
  <a href="/matriz">Matriz</a>
  <a href="/dashboard">Dashboard</a>
  <a href="/glosa">Glosa</a>
  <a href="/incidencias">Incidencias</a>
  <span class="estado" id="estado-datos"></span>
</nav>
<main>
{% block contenido %}{% endblock %}
</main>
<script>
fetch('/api/salud').then(r=>r.json()).then(s=>{
  const e=document.getElementById('estado-datos');
  if(e) e.textContent = 'modo: ' + s.modo + (s.db ? '' : ' (base apagada)') + ' · corte ' + s.fecha_corte;
}).catch(()=>{});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
